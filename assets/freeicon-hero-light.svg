<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="100%" height="100%" fill="none">
  <!-- Card Container with 24px Squircle Radius -->
  <rect x="2" y="2" width="956" height="296" rx="24" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2"/>

  <!-- Subtle Dot Grid in Background -->
  <defs>
    <pattern id="grid-light" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#E2E8F0" />
    </pattern>
  </defs>
  <rect x="20" y="20" width="920" height="260" rx="16" fill="url(#grid-light)" opacity="0.6"/>

  <!-- Brand Mark Icon Box (72x72) -->
  <g transform="translate(64, 60)">
    <rect width="72" height="72" rx="18" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1.5"/>
    
    <!-- Geometric Monogram Icon -->
    <text x="36" y="49" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#0F172A">F</text>
    <circle cx="54" cy="22" r="4" fill="#7C3AED" />
    
  </g>

  <!-- Typography: Wordmark & Core Tagline -->
  <text x="156" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="44" font-weight="800" fill="#0F172A" letter-spacing="-1">freeicon<tspan font-size="28" font-weight="500" fill="#7C3AED"> MCP</tspan></text>
  
  <text x="156" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" font-weight="400" fill="#64748B">Search, download &amp; generate icons from 19 free sources — built for AI</text>

  <!-- Divider Line -->
  <line x1="64" y1="180" x2="896" y2="180" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Bottom Badges / Tech Capabilities -->
  <g transform="translate(64, 210)">

    <!-- Pill: 19 Free Sources -->
    <rect x="0" y="0" width="163" height="34" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="16" cy="17" r="4" fill="#7C3AED"/>
    <text x="28" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#6D28D9">19 Free Sources</text>
        

    <!-- Pill: 1M+ Icons -->
    <rect x="175" y="0" width="117" height="34" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="191" cy="17" r="4" fill="#7C3AED"/>
    <text x="203" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#6D28D9">1M+ Icons</text>
        

    <!-- Pill: SVG Generation -->
    <rect x="304" y="0" width="159" height="34" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="320" cy="17" r="4" fill="#7C3AED"/>
    <text x="332" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#6D28D9">SVG Generation</text>
        

    <!-- Pill: MCP Native -->
    <rect x="475" y="0" width="129" height="34" rx="8" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1"/>
    <circle cx="491" cy="17" r="4" fill="#7C3AED"/>
    <text x="503" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#6D28D9">MCP Native</text>
        
    <!-- Right Side Protocol Tag -->
    <text x="832" y="22" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" font-size="13" font-weight="500" fill="#64748B">v0.1.3 · MIT</text>
  </g>
</svg>